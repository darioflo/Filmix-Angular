<section class="section-image w-screen flex justify-center items-center">
  <div
    class="hero-image w-screen h-screen relative"
    *ngIf="movie.thumb[0]; else elseBlock"
  >
    <video
      [src]="movie.thumb[0]"
      autoplay
      loop
      muted
      class="w-full h-full object-cover"
    ></video>
  </div>
  <ng-template #elseBlock>
    <div
      class="hero-image w-screen h-screen relative"
      [ngStyle]="{
        'background-image': 'url(' + movie.thumb[1] + ')',
        'background-size': 'cover',
        'background-position': 'center',
        'background-attachment': 'fixed'
      }"
    ></div>
  </ng-template>
  <div class="hero-absolute absolute flex justify-start items-center">
    <div class="info w-[50%] h-[auto]">
      <h1 class="text-8xl">{{ movie.name }}</h1>
      <p class="text-2xl">{{ movie.description }}</p>
      <p class="text-2xl">{{ movie.genre }}</p>
      <p class="text-2xl">{{ movie.languague }}</p>
      <p class="text-2xl">
        {{`${movie.actors[0]}, ${movie.actors[1]}, ${movie.actors[2]}`}}
      </p>
    </div>
  </div>
</section>

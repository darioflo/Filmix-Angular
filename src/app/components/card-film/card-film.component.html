<div
  class="card-film flex justify-center items-center flex-col border-4 border-b-emerald-700 w-[20rem] h-[25rem] cursor-pointer rounded-lg shadow-lg overflow-hidden transition-transform transform hover:scale-105"
  (click)="goToDetails(film()?.id)"
>
  <div
    class="w-[100%] h-[15rem] bg-cover bg-center"
    [ngStyle]="{
      'background-image':
        'url(https://image.tmdb.org/t/p/w500/' +
        ((film()?.backdrop_path ?? tvShow()?.backdrop_path) ||
          (film()?.poster_path ?? tvShow()?.poster_path)) +
        ')',
      'background-attachment': 'fixed',
      'background-size': 'cover',
      'background-position': 'center'
    }"
  ></div>
  <div
    class="info-film flex justify-start items-start flex-col bg-gray-800 text-white border-t border-slate-600 w-[100%] h-[15rem] gap-2 p-4"
  >
    <h3 class="text-lg font-bold">
      Movie: <b>{{ film()?.original_title ?? tvShow()?.name }}</b>
    </h3>
    <p class="text-sm">
      Language:
      <b>{{ film()?.original_language ?? tvShow()?.original_language }}</b>
    </p>
    <p class="text-sm">
      Popularity: <b>{{ film()?.popularity ?? tvShow()?.popularity }}</b>
    </p>
    <p class="text-sm">
      <b>{{ film()?.release_date ?? tvShow()?.first_air_date }}</b>
    </p>
    <button
      class="rounded-[50%] w-[3rem] h-[3rem] bg-red-700 text-amber-50 cursor-pointer text-2xl"
      (click)="addToFav($event)"
    >
      {{ added ? "✔" : "+" }}
    </button>
  </div>
</div>
